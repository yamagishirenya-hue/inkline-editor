<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inkline エディタ</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- トップバー -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="menu-wrap">
          <button id="openBtn" class="tool-btn" title="ファイルを開く (Ctrl+O)">
            <span class="material-symbols-outlined">folder_open</span>
            <span class="btn-label">開く</span>
          </button>
        </div>
        <div class="menu-wrap">
          <button id="recentBtn" class="tool-btn icon-only" title="最近使ったファイル">
            <span class="material-symbols-outlined">history</span>
          </button>
          <div id="recentMenu" class="menu" hidden>
            <div class="menu-group-label">最近使ったファイル</div>
            <div id="recentList"></div>
          </div>
        </div>
        <button id="newBtn" class="tool-btn" title="新しいタブ (Ctrl+N)">
          <span class="material-symbols-outlined">note_add</span>
          <span class="btn-label">新規</span>
        </button>

        <div class="menu-wrap">
          <button id="toolsBtn" class="tool-btn" title="編集ツール">
            <span class="material-symbols-outlined">build</span>
            <span class="btn-label">ツール</span>
            <span class="material-symbols-outlined caret">expand_more</span>
          </button>
          <div id="toolsMenu" class="menu" hidden>
            <div class="menu-category" data-cat="case">
              <span class="menu-category-label">文字種変換</span>
              <span class="material-symbols-outlined menu-category-caret">chevron_right</span>
              <div class="submenu">
                <button data-action="upper" class="menu-item">大文字に変換</button>
                <button data-action="lower" class="menu-item">小文字に変換</button>
                <button data-action="title" class="menu-item">単語の先頭を大文字に</button>
              </div>
            </div>
            <div class="menu-category" data-cat="lines">
              <span class="menu-category-label">行の操作</span>
              <span class="material-symbols-outlined menu-category-caret">chevron_right</span>
              <div class="submenu">
                <button data-action="sortAsc" class="menu-item">行を並び替え(昇順)</button>
                <button data-action="sortDesc" class="menu-item">行を並び替え(降順)</button>
                <button data-action="reverseLines" class="menu-item">行を逆順にする</button>
                <button data-action="dedupe" class="menu-item">重複行を削除</button>
                <button data-action="removeBlank" class="menu-item">空行を削除</button>
                <button data-action="trimTrailing" class="menu-item">行末の空白を削除</button>
                <button data-action="insertLineNumbers" class="menu-item">行番号を挿入</button>
              </div>
            </div>
            <div class="menu-category" data-cat="eol">
              <span class="menu-category-label">タブ・改行</span>
              <span class="material-symbols-outlined menu-category-caret">chevron_right</span>
              <div class="submenu">
                <button data-action="tabToSpace" class="menu-item">タブ→スペースに変換</button>
                <button data-action="spaceToTab" class="menu-item">先頭スペース→タブに変換</button>
                <button data-action="eolToLF" class="menu-item">改行コードをLFに統一</button>
                <button data-action="eolToCRLF" class="menu-item">改行コードをCRLFに統一</button>
              </div>
            </div>
            <div class="menu-category" data-cat="util">
              <span class="menu-category-label">便利機能</span>
              <span class="material-symbols-outlined menu-category-caret">chevron_right</span>
              <div class="submenu">
                <button data-action="gotoLine" class="menu-item">行へ移動 (Ctrl+G)</button>
                <button data-action="insertTimestamp" class="menu-item">現在日時を挿入</button>
                <button data-action="columnEdit" class="menu-item">列を指定して挿入/削除(簡易矩形編集)</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <div class="menu-wrap">
          <button id="encodingBtn" class="tool-btn" title="文字コード">
            <span class="material-symbols-outlined">translate</span>
            <span id="encodingLabel" class="btn-label">UTF-8</span>
          </button>
          <div id="encodingMenu" class="menu" hidden>
            <div class="menu-group-label">読み込みし直す</div>
            <button data-enc="UTF-8" class="menu-item">UTF-8として再読み込み</button>
            <button data-enc="Shift_JIS" class="menu-item">Shift-JISとして再読み込み</button>
            <div class="menu-divider"></div>
            <div class="menu-note">保存時は常にUTF-8で書き込まれます</div>
          </div>
        </div>

        <div class="font-size-group">
          <button id="fontDownBtn" class="tool-btn icon-only" title="文字を小さく (Ctrl+-)">
            <span class="material-symbols-outlined">remove</span>
          </button>
          <span id="fontSizeLabel" class="font-size-label">13px</span>
          <button id="fontUpBtn" class="tool-btn icon-only" title="文字を大きく (Ctrl++)">
            <span class="material-symbols-outlined">add</span>
          </button>
        </div>

        <button id="mdPreviewBtn" class="tool-btn icon-only" title="Markdownプレビュー">
          <span class="material-symbols-outlined">visibility</span>
        </button>
        <button id="wrapBtn" class="tool-btn icon-only" title="折り返し切替">
          <span class="material-symbols-outlined">wrap_text</span>
        </button>
        <button id="findBtn" class="tool-btn icon-only" title="検索と置換 (Ctrl+F)">
          <span class="material-symbols-outlined">search</span>
        </button>
        <button id="themeBtn" class="tool-btn icon-only" title="ライト/ダーク切替">
          <span class="material-symbols-outlined">contrast</span>
        </button>
        <button id="saveBtn" class="tool-btn primary" title="保存 (Ctrl+S)">
          <span class="material-symbols-outlined">save</span>
          <span class="btn-label">保存</span>
        </button>
        <button id="saveAsBtn" class="tool-btn icon-only" title="名前を付けて保存 (Ctrl+Shift+S)">
          <span class="material-symbols-outlined">save_as</span>
        </button>
      </div>
    </header>

    <!-- タブバー -->
    <div class="tabbar-wrap">
      <div id="tabbar" class="tabbar"></div>
      <button id="addTabBtn" class="tab-add-btn" title="新しいタブ (Ctrl+N)">
        <span class="material-symbols-outlined">add</span>
      </button>
    </div>

    <!-- 検索・置換パネル -->
    <div id="findPanel" class="find-panel" hidden>
      <div class="find-row">
        <span class="material-symbols-outlined find-icon">search</span>
        <input id="findInput" type="text" placeholder="検索" class="find-input" />
        <span class="material-symbols-outlined find-icon">sync_alt</span>
        <input id="replaceInput" type="text" placeholder="置換後の文字列" class="find-input" />
      </div>
      <div class="find-row">
        <label class="find-toggle">
          <input type="checkbox" id="regexToggle" />
          正規表現
        </label>
        <label class="find-toggle">
          <input type="checkbox" id="caseToggle" />
          大文字/小文字を区別
        </label>
        <span class="spacer-inline"></span>
        <button id="findPrevBtn" class="find-btn" title="前へ">
          <span class="material-symbols-outlined">arrow_upward</span>
        </button>
        <button id="findNextBtn" class="find-btn" title="次へ">
          <span class="material-symbols-outlined">arrow_downward</span>
        </button>
        <button id="replaceBtn" class="find-btn">置換</button>
        <button id="replaceAllBtn" class="find-btn primary-outline">すべて置換</button>
        <span id="findCount" class="find-count"></span>
        <button id="findCloseBtn" class="find-close" title="閉じる">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>

    <!-- 行へ移動パネル -->
    <div id="gotoPanel" class="find-panel" hidden>
      <div class="find-row">
        <span class="material-symbols-outlined find-icon">arrow_forward</span>
        <input id="gotoInput" type="number" min="1" placeholder="行番号" class="find-input short" />
        <button id="gotoGoBtn" class="find-btn primary-outline">移動</button>
        <span class="spacer-inline"></span>
        <button id="gotoCloseBtn" class="find-close" title="閉じる">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>

    <!-- 列指定 挿入/削除パネル(簡易矩形編集) -->
    <div id="columnPanel" class="find-panel" hidden>
      <div class="find-row">
        <span class="find-label">開始行</span>
        <input id="colStartLine" type="number" min="1" class="find-input short" />
        <span class="find-label">終了行</span>
        <input id="colEndLine" type="number" min="1" class="find-input short" />
        <span class="find-label">列</span>
        <input id="colIndex" type="number" min="1" class="find-input short" />
      </div>
      <div class="find-row">
        <input id="colInsertText" type="text" placeholder="挿入する文字列(空欄でOK)" class="find-input" />
        <span class="find-label">削除文字数</span>
        <input id="colDeleteCount" type="number" min="0" value="0" class="find-input short" />
        <button id="colApplyBtn" class="find-btn primary-outline">適用</button>
        <span class="spacer-inline"></span>
        <button id="columnCloseBtn" class="find-close" title="閉じる">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="find-row">
        <span class="menu-note">選択範囲があれば開始/終了行を自動入力します。列は1始まりです。</span>
      </div>
    </div>

    <!-- 外部変更の通知バー -->
    <div id="externalChangeBar" class="notice-bar" hidden>
      <span class="material-symbols-outlined">sync_problem</span>
      <span id="externalChangeMsg">このファイルは外部で更新されています。</span>
      <button id="externalReloadBtn" class="find-btn primary-outline">最新の内容を読み込む</button>
      <button id="externalDismissBtn" class="find-close" title="閉じる">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- エディタ本体 -->
    <div class="editor-wrap">
      <div id="gutter" class="gutter"></div>
      <div class="editor-col">
        <pre id="highlightLayer" class="highlight-layer" aria-hidden="true"><code id="highlightCode"></code></pre>
        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          placeholder="ここに書き始めてください…"
        ></textarea>
      </div>
      <div id="mdPreview" class="md-preview" hidden></div>
    </div>

    <!-- ステータスバー -->
    <footer class="statusbar">
      <div class="counter-box" title="行番号:列番号">
        <span class="material-symbols-outlined status-icon">location_on</span>
        <span id="lineCol">1:1</span>
      </div>
      <div class="counter-box" title="文字数">
        <span id="charCount">0</span>
        <label>文字</label>
      </div>
      <div class="counter-box" title="単語数">
        <span id="wordCount">0</span>
        <label>語</label>
      </div>
      <div class="counter-box" title="行数">
        <span id="lineTotal">1</span>
        <label>行</label>
      </div>
      <div id="selectionBox" class="counter-box" hidden title="選択範囲の文字数/行数">
        <span class="material-symbols-outlined status-icon">highlight_alt</span>
        <span id="selectionInfo"></span>
      </div>
      <div id="bracketBox" class="counter-box" hidden title="対応する括弧の位置">
        <span class="material-symbols-outlined status-icon">data_object</span>
        <span id="bracketInfo"></span>
      </div>
      <div class="spacer"></div>
      <span id="statusMsg" class="status-msg">準備完了</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
